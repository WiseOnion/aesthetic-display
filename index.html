<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Aesthetic Display</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    img {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>
  <img src="Eyee.GIF" alt="">
</body>
</html>
